<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Gym">
<meta name="theme-color" content="#0d0e12">
<link rel="apple-touch-icon" id="ic">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<title>Gym</title>
<style>
:root{--bg:#0d0e12;--card:#171920;--line:#262a34;--tx:#f2f3f6;--mu:#8b90a0;--a:#2e6bff;--ok:#25c26e}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.35 "Inter",-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;color-scheme:dark}
*{font-family:inherit}
body{padding:env(safe-area-inset-top) 0 0}
button{font:inherit;color:inherit;background:var(--line);border:0;border-radius:12px;padding:9px 13px;cursor:pointer}
button:active{opacity:.7}
input,textarea,select{font:inherit;font-size:17px;color:var(--tx);background:#0d0e12;border:1px solid var(--line);border-radius:10px;padding:9px;width:100%}
small{color:var(--mu)}
header.top{position:sticky;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between;padding:10px 14px;background:rgba(13,14,18,.85);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.tools{display:flex;gap:6px;align-items:center}
.tools button{padding:7px 10px;font-size:18px;line-height:1}
.tools button.on{background:var(--a)}
#lk{opacity:.35;font-size:17px;padding:0 4px}#lk.on{opacity:1}
.sig{font-size:26px;font-weight:800;text-transform:uppercase;letter-spacing:.14em;color:var(--tx)}
#main{padding:12px 12px 150px;max-width:560px;margin:0 auto}
.tabs{display:flex;gap:8px;margin-bottom:12px}
.tab{flex:1;background:var(--card);border:2px solid var(--c);color:var(--c);font-weight:600}
.tab.on{background:var(--c);color:#0d0e12}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;margin-bottom:12px}
.card header{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.card h3{margin:0 0 2px;font-size:18px}
.ctl{display:flex;gap:6px}.ctl button{padding:6px 10px;font-size:14px}
.note{margin:8px 0 0;padding:8px 10px;border-left:3px solid var(--a);background:#1e2230;border-radius:8px;font-size:14px;color:#c9cde0}
textarea{margin-top:8px;font-size:15px;min-height:44px}
.set{display:grid;grid-template-columns:24px 1fr 1fr 52px;gap:8px;align-items:center;margin-top:8px}
.set .n{color:var(--mu);text-align:center}
.set label{position:relative;display:block}
.set label i{position:absolute;right:10px;top:50%;transform:translateY(-50%);font-style:normal;font-size:12px;color:var(--mu);pointer-events:none}
.set input{text-align:center;padding-right:30px}
.ck{height:44px;border-radius:12px;background:#1d3a2b;color:var(--ok);font-size:22px;padding:0}
.set.done .ck{background:var(--ok);color:#06210f}
.set.done input{opacity:.55}
.sec{font-size:15px;color:var(--mu);margin:20px 4px 8px;font-weight:600}
.held{display:flex;justify-content:space-between;align-items:center;background:var(--card);border:1px dashed #3a3f4e;border-radius:14px;padding:12px 14px;margin-bottom:8px}
.held small{display:block}
.fin{width:100%;margin-top:14px;background:var(--a);font-weight:600;padding:14px}
.add{display:grid;gap:8px;margin-bottom:12px;padding:14px;border:1px dashed var(--a);border-radius:18px}
.add .r{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
#timer{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));z-index:20;max-width:536px;margin:0 auto;border-radius:22px;overflow:hidden;background:rgba(40,44,58,.5);-webkit-backdrop-filter:blur(22px) saturate(170%);backdrop-filter:blur(22px) saturate(170%);border:1px solid rgba(255,255,255,.14);box-shadow:0 10px 30px rgba(0,0,0,.45);display:none}
#timer.show{display:block}
#tb{position:absolute;left:0;top:0;bottom:0;width:0;background:rgba(46,107,255,.28);transition:width .25s linear}
.tw{position:relative;display:flex;justify-content:space-between;align-items:center;padding:12px 14px;gap:8px}
#tt{display:block;font-size:30px;font-variant-numeric:tabular-nums;font-weight:700;line-height:1.1}
#tl{display:block;max-width:34vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tc{display:flex;gap:6px}.tc button{background:rgba(255,255,255,.12);padding:9px 11px;font-size:15px}
#sheet{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.6);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);display:none;overflow-y:auto;padding:calc(env(safe-area-inset-top) + 16px) 12px calc(env(safe-area-inset-bottom) + 16px)}
#sheet.show{display:block}
.panel{max-width:560px;margin:0 auto;background:var(--bg);border:1px solid var(--line);border-radius:22px;padding:16px}
.panel h2{margin:0 0 12px;font-size:20px}.panel label{display:block;margin:10px 0;font-size:14px;color:var(--mu)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.chip{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 12px;font-weight:600}
.chip b{color:var(--a)}
.close{width:100%;margin-top:14px}
svg.body{width:100%;max-width:300px;display:block;margin:0 auto}
.body rect,.body ellipse,.body circle{fill:#272a33}
.body .on{fill:var(--a)}
.body text{fill:var(--mu);font-size:9px;text-anchor:middle}
.leg{display:grid;grid-template-columns:1fr 1fr;gap:6px 14px;font-size:14px;margin-top:8px}
.leg span i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px}
.donut{display:block;margin:0 auto;width:180px}
h4{margin:20px 0 8px;font-size:15px;color:var(--mu)}
</style>
</head>
<body>
<header class="top">
  <div class="tools">
    <span id="lk" title="Schermo sempre acceso">🔒</span>
    <button data-a="plates" aria-label="Calcolo dischi">🧮</button>
    <button data-a="stats" aria-label="Statistiche">📊</button>
    <button data-a="edit" id="eb" aria-label="Modifica scheda">✏️</button>
  </div>
  <span class="sig">russ</span>
</header>
<div id="main"></div>
<div id="timer">
  <div id="tb"></div>
  <div class="tw">
    <div><small id="tl"></small><b id="tt">0:00</b></div>
    <div class="tc"><button data-a="t30">+30s</button><button data-a="tp" id="tpb">Pausa</button><button data-a="ts">Salta</button></div>
  </div>
</div>
<div id="sheet"><div class="panel" id="panel"></div></div>

<script>
const $=s=>document.querySelector(s);
const K='gym.v1';
const MU={pet:'Petto',dor:'Dorso',spa:'Spalle',bic:'Bicipiti',tri:'Tricipiti',qua:'Quadricipiti',fem:'Femorali e glutei',pol:'Polpacci',cor:'Core'};
const GR={pet:'Petto',dor:'Dorso',spa:'Spalle',bic:'Braccia',tri:'Braccia',qua:'Gambe',fem:'Gambe',pol:'Gambe',cor:'Core'};
const DC={mar:'#f5c518',gio:'#ff4b4b',sab:'#8ff0a4'};
const GC={Petto:'#2e6bff',Dorso:'#5b8dff',Spalle:'#8db0ff',Braccia:'#25c2a0',Gambe:'#e0a93b',Core:'#9a7bff'};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const num=v=>parseFloat(String(v).replace(',','.'))||0;
const fmt=s=>Math.floor(s/60)+':'+String(s%60).padStart(2,'0');
const mk=(n,m,r,w,s=3,note='')=>({id:'e'+Math.random().toString(36).slice(2,8),n,m,r,w,s,note});

function defPlan(){return[
 {id:'mar',name:'Martedì',ex:[mk('Squat','qua','6-8',35),mk('Panca piana','pet','6-8',25),mk('Lat pulldown','dor','6-8',53),mk('Leg curl seduto','fem','12-15',55),mk('Shoulder press','spa','8-10',35),mk('Reverse pec fly','spa','12-15',20),mk('Curl bicipiti','bic','8-10',12),mk('Tricipiti alla barra','tri','10-12',45),mk('Calf pendolum','pol','12-15',10),mk('Captains chair','cor','10-12',0)]},
 {id:'gio',name:'Giovedì',ex:[mk('Bulgarian split squat','qua','10-12',14),mk('RDL','fem','10-12',20),mk('Low row','dor','8-10',55),mk('Panca inclinata manubri','pet','8-10',16),mk('Alzate laterali','spa','12-15',6),mk('Hammer curl','bic','8-10',10),mk('Skull crushers','tri','10-12',10),mk('Calf press','pol','12-15',40),mk('Cable crunch','cor','10-12',69)]},
 {id:'sab',name:'Sabato',ex:[mk('Hack squat','qua','10-12',75),mk('T-bar','dor','8-10',25),mk('Pec fly','pet','12-15',15),mk('Lying leg curl','fem','10-12',44),mk('Alzate laterali ai cavi','spa','12-15',7),mk('Reverse pec fly','spa','12-15',15),mk('Bayesian curl','bic','10-12',15),mk('Tricipiti corde','tri','10-12',40),mk('Calf pendolum','pol','12-15',10),mk('Ab wheel rollout','cor','10-12',0)]}
]}

function load(){try{const s=JSON.parse(localStorage.getItem(K));if(s&&s.plan)return s}catch(e){}
 const wd=new Date().getDay();return{plan:defPlan(),day:wd===4?1:wd===6?2:0,sess:{},hist:[],bar:20,timer:null,edit:false}}
let S=load();
function save(){try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}}
const day=()=>S.plan[S.day];

function sess(){
 const d=day();let s=S.sess[d.id];if(!s)s=S.sess[d.id]={sets:{},hold:[],t:Date.now()};
 d.ex.forEach(e=>{const a=s.sets[e.id]||(s.sets[e.id]=[]);
  while(a.length<e.s)a.push({kg:e.w,reps:parseInt(e.r)||8,done:false});
  if(a.length>e.s&&!a.slice(e.s).some(x=>x.done))a.length=e.s});
 return s}

/* ---------- render ---------- */
function card(e,s){
 const a=s.sets[e.id];
 const ctl=S.edit
  ?`<button data-a="up" data-id="${e.id}">↑</button><button data-a="dn" data-id="${e.id}">↓</button><button data-a="del" data-id="${e.id}">✕</button>`
  :`<button data-a="hold" data-id="${e.id}">Pausa</button>`;
 const edit=S.edit
  ?`<textarea data-f="note" data-id="${e.id}" placeholder="Note macchina (es. Sedia 4, schienale 6° buco)">${esc(e.note)}</textarea>
    <div class="ctl" style="margin-top:8px;align-items:center"><button data-a="sm" data-id="${e.id}">−</button><span>${e.s} serie</span><button data-a="sp" data-id="${e.id}">+</button></div>`
  :(e.note?`<p class="note">${esc(e.note)}</p>`:'');
 return `<section class="card"><header><div><h3>${esc(e.n)}</h3><small>${MU[e.m]} · ${esc(e.r)} rep</small></div><div class="ctl">${ctl}</div></header>${edit}
 ${a.map((x,j)=>`<div class="set ${x.done?'done':''}"><span class="n">${j+1}</span>
  <label><input inputmode="decimal" data-f="kg" data-id="${e.id}" data-j="${j}" value="${x.kg}"><i>kg</i></label>
  <label><input inputmode="numeric" data-f="reps" data-id="${e.id}" data-j="${j}" value="${x.reps}"><i>rep</i></label>
  <button class="ck" data-a="ck" data-id="${e.id}" data-j="${j}" aria-label="Serie completata">✓</button></div>`).join('')}
 </section>`}

function render(){
 const d=day(),s=sess();
 $('#eb').classList.toggle('on',S.edit);
 let h=`<div class="tabs">${S.plan.map((p,i)=>`<button class="tab ${i===S.day?'on':''}" style="--c:${DC[p.id]||'#2e6bff'}" data-a="day" data-i="${i}">${p.name}</button>`).join('')}</div>`;
 h+=d.ex.filter(e=>!s.hold.includes(e.id)).map(e=>card(e,s)).join('');
 if(S.edit)h+=`<div class="add"><b>Nuovo esercizio</b><input id="an" placeholder="Nome esercizio">
  <select id="am">${Object.entries(MU).map(([k,v])=>`<option value="${k}">${v}</option>`).join('')}</select>
  <div class="r"><input id="ar" value="8-10" aria-label="Range rep"><input id="aw" inputmode="decimal" placeholder="kg"><button data-a="add">Aggiungi</button></div></div>`;
 const held=d.ex.filter(e=>s.hold.includes(e.id));
 if(held.length)h+=`<div class="sec">In pausa</div>`+held.map(e=>`<div class="held"><div><b>${esc(e.n)}</b><small>${s.sets[e.id].filter(x=>x.done).length}/${e.s} serie</small></div><button data-a="resume" data-id="${e.id}">Riprendi</button></div>`).join('');
 h+=`<button class="fin" data-a="finish">Termina allenamento</button>`;
 $('#main').innerHTML=h}

/* ---------- eventi ---------- */
document.addEventListener('pointerdown',()=>{initAudio();if(!wl)lock()},{passive:true});
document.addEventListener('input',ev=>{
 const t=ev.target,f=t.dataset.f;
 if(t.id==='pt'||t.id==='pb')return calcPlates();
 if(f==='note'){const e=day().ex.find(x=>x.id===t.dataset.id);e.note=t.value;return save()}
 if(f==='kg'||f==='reps'){
  const id=t.dataset.id,j=+t.dataset.j,a=sess().sets[id],v=num(t.value);a[j][f]=v;
  for(let k=j+1;k<a.length;k++)if(!a[k].done){a[k][f]=v;const i=$(`input[data-id="${id}"][data-j="${k}"][data-f="${f}"]`);if(i)i.value=t.value}
  save()}});
document.addEventListener('change',ev=>{if(ev.target.id==='sx'){$('#ch').innerHTML=chart(ev.target.value)}});
document.addEventListener('click',ev=>{
 const b=ev.target.closest('[data-a]');if(!b)return;
 const a=b.dataset.a,id=b.dataset.id,d=day(),s=sess(),e=d.ex.find(x=>x.id===id);
 switch(a){
  case'day':S.day=+b.dataset.i;break;
  case'ck':{const x=s.sets[id][+b.dataset.j];x.done=!x.done;if(x.done)startTimer(e);break}
  case'hold':s.hold.push(id);break;
  case'resume':s.hold=s.hold.filter(h=>h!==id);break;
  case'up':case'dn':{const i=d.ex.indexOf(e),k=a==='up'?i-1:i+1;if(k>=0&&k<d.ex.length)[d.ex[i],d.ex[k]]=[d.ex[k],d.ex[i]];break}
  case'del':if(!confirm('Eliminare "'+e.n+'" dalla scheda?'))return;d.ex.splice(d.ex.indexOf(e),1);s.hold=s.hold.filter(h=>h!==id);break;
  case'sm':e.s=Math.max(1,e.s-1);break;
  case'sp':e.s=Math.min(8,e.s+1);break;
  case'add':{const n=$('#an').value.trim();if(!n)return $('#an').focus();d.ex.push(mk(n,$('#am').value,$('#ar').value||'8-10',num($('#aw').value)));break}
  case'edit':S.edit=!S.edit;break;
  case'plates':return openPlates();
  case'stats':return openStats();
  case'close':return closeSheet();
  case'bar':$('#pb').value=b.dataset.v;return calcPlates();
  case'finish':return finish();
  case't30':if(S.timer){if(S.timer.pa!=null)S.timer.pa+=30000;else S.timer.end+=30000;S.timer.tot+=30}save();return tick();
  case'tp':if(S.timer){const t=S.timer;if(t.pa==null)t.pa=Math.max(0,t.end-Date.now());else{t.end=Date.now()+t.pa;t.pa=null}}save();return tick();
  case'ts':S.timer=null;save();return tick();
 }
 save();render()});

/* ---------- timer ---------- */
let ac;
function initAudio(){try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended')ac.resume()}catch(e){}}
function beep(){initAudio();if(ac)[0,.25,.5].forEach(d=>{const o=ac.createOscillator(),g=ac.createGain(),t=ac.currentTime+d;o.frequency.value=880;o.connect(g);g.connect(ac.destination);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.4,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+.18);o.start(t);o.stop(t+.2)});
 try{navigator.vibrate&&navigator.vibrate([200,100,200,100,200])}catch(e){}}
function startTimer(e){const sec=(parseInt(e.r)||10)<=8?120:90;S.timer={end:Date.now()+sec*1000,tot:sec,pa:null,lab:e.n};save();tick()}
function tick(){
 const t=S.timer,el=$('#timer');
 if(!t){el.classList.remove('show');return}
 if(t.pa==null&&Date.now()>=t.end){S.timer=null;save();el.classList.remove('show');beep();return}
 const rem=t.pa!=null?Math.ceil(t.pa/1000):Math.max(0,Math.ceil((t.end-Date.now())/1000));
 el.classList.add('show');
 $('#tt').textContent=fmt(rem);$('#tl').textContent=t.lab;
 $('#tb').style.width=Math.min(100,100-100*rem/Math.max(t.tot,1))+'%';
 $('#tpb').textContent=t.pa!=null?'Riprendi':'Pausa'}
setInterval(tick,250);

/* ---------- wake lock ---------- */
let wl=null;
async function lock(){try{wl=await navigator.wakeLock.request('screen');$('#lk').classList.add('on');wl.addEventListener('release',()=>{wl=null;$('#lk').classList.remove('on')})}catch(e){wl=null}}
document.addEventListener('visibilitychange',()=>{if(!document.hidden){lock();tick()}});

/* ---------- sheet ---------- */
function openSheet(h){$('#panel').innerHTML=h+'<button class="close" data-a="close">Chiudi</button>';$('#sheet').classList.add('show')}
function closeSheet(){$('#sheet').classList.remove('show')}

/* ---------- dischi ---------- */
function openPlates(){
 openSheet(`<h2>Calcolo dischi</h2>
 <label>Peso target (kg)<input id="pt" inputmode="decimal" placeholder="es. 80"></label>
 <label>Base bilanciere (kg)<input id="pb" inputmode="decimal" value="${S.bar}"></label>
 <div class="chips"><button data-a="bar" data-v="20">Olimpionico 20</button><button data-a="bar" data-v="10">EZ 10</button><button data-a="bar" data-v="0">Macchinario 0</button></div>
 <h4>Per lato</h4><div id="po"><small>Inserisci il peso target.</small></div>`)}
function calcPlates(){
 const t=num($('#pt').value),b=num($('#pb').value);S.bar=b;save();
 const o=$('#po');if(!t)return o.innerHTML='<small>Inserisci il peso target.</small>';
 let r=(t-b)/2;if(r<0)return o.innerHTML='<small>Il target è sotto il peso della base.</small>';
 const res=[];[25,20,15,10,5,2.5,1.25].forEach(p=>{const n=Math.floor(r/p+1e-9);if(n>0){res.push([p,n]);r-=n*p}});
 o.innerHTML=(res.length?`<div class="chips">${res.map(([p,n])=>`<span class="chip"><b>${n}×</b> ${p}</span>`).join('')}</div>`:'<small>Solo la base.</small>')+(r>0.001?`<small>Mancano ${+(r*2).toFixed(2)} kg in totale: serve un disco più piccolo.</small>`:'')}

/* ---------- fine allenamento + statistiche ---------- */
function finish(){
 const d=day(),s=sess();
 const items=d.ex.map(e=>({n:e.n,m:e.m,sets:s.sets[e.id].filter(x=>x.done).map(x=>({kg:x.kg,reps:x.reps}))})).filter(i=>i.sets.length);
 if(!items.length)return alert('Completa almeno una serie prima di terminare.');
 if(d.ex.some(e=>s.sets[e.id].some(x=>!x.done))&&!confirm('Ci sono serie non completate. Terminare comunque?'))return;
 const w={date:new Date().toISOString(),day:d.name,items};
 S.hist.push(w);
 d.ex.forEach(e=>{const done=s.sets[e.id].filter(x=>x.done);if(done.length)e.w=done[done.length-1].kg});
 delete S.sess[d.id];S.timer=null;S.edit=false;save();render();tick();openStats(w)}

const e1=(kg,r)=>r<=1?kg:kg*(1+r/30);
function fig(ox,front,on){
 const c=m=>m&&on.has(m)?' class="on"':'';
 const R=(x,y,w,h,r,m)=>`<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${r}"${c(m)}/>`;
 const E=(cx,cy,rx,ry,m)=>`<ellipse cx="${cx}" cy="${cy}" rx="${rx}" ry="${ry}"${c(m)}/>`;
 let s=`<g transform="translate(${ox},0)"><circle cx="50" cy="13" r="9"/>${R(45,21,10,7,3)}${E(29,36,9,7,'spa')}${E(71,36,9,7,'spa')}`;
 s+=front
  ?R(33,31,34,22,9,'pet')+R(36,55,28,30,7,'cor')+R(17,44,11,26,5,'bic')+R(72,44,11,26,5,'bic')+R(33,88,15,44,7,'qua')+R(52,88,15,44,7,'qua')
  :R(33,31,34,34,9,'dor')+R(17,44,11,26,5,'tri')+R(72,44,11,26,5,'tri')+R(34,66,32,18,8,'fem')+R(33,88,15,44,7,'fem')+R(52,88,15,44,7,'fem');
 return s+R(14,72,10,28,5)+R(76,72,10,28,5)+R(34,136,13,44,6,'pol')+R(53,136,13,44,6,'pol')+`<text x="50" y="194">${front?'Fronte':'Retro'}</text></g>`}

function donut(vol){
 const tot=Object.values(vol).reduce((a,b)=>a+b,0)||1,C=2*Math.PI*40;let acc=0;
 const ents=Object.entries(vol).sort((a,b)=>b[1]-a[1]);
 const arcs=ents.map(([g,v])=>{const l=C*v/tot,o=`<circle cx="60" cy="60" r="40" fill="none" stroke="${GC[g]}" stroke-width="16" stroke-dasharray="${l} ${C-l}" stroke-dashoffset="${-acc}" transform="rotate(-90 60 60)"/>`;acc+=l;return o}).join('');
 return `<svg class="donut" viewBox="0 0 120 120">${arcs}<text x="60" y="58" text-anchor="middle" fill="#f2f3f6" font-size="13" font-weight="700">${Math.round(tot).toLocaleString('it')}</text><text x="60" y="72" text-anchor="middle" fill="#8b90a0" font-size="8">kg × rep</text></svg>
 <div class="leg">${ents.map(([g,v])=>`<span><i style="background:${GC[g]}"></i>${g} ${Math.round(100*v/tot)}%</span>`).join('')}</div>`}

function chart(name){
 const pts=S.hist.map(w=>{const it=w.items.find(i=>i.n===name);return it?{d:w.date,v:Math.max(...it.sets.map(x=>e1(x.kg,x.reps)))}:null}).filter(Boolean);
 if(!pts.length)return'<small>Nessun dato.</small>';
 const W=320,H=150,P=26,mn=Math.min(...pts.map(p=>p.v)),mx=Math.max(...pts.map(p=>p.v)),rg=(mx-mn)||1;
 const X=i=>pts.length>1?P+i*(W-2*P)/(pts.length-1):W/2,Y=v=>H-P-(v-mn)*(H-2*P)/rg;
 const dt=p=>new Date(p.d).toLocaleDateString('it',{day:'numeric',month:'short'});
 return `<svg viewBox="0 0 ${W} ${H}" style="width:100%"><polyline fill="none" stroke="#2e6bff" stroke-width="2.5" points="${pts.map((p,i)=>X(i)+','+Y(p.v)).join(' ')}"/>
 ${pts.map((p,i)=>`<circle cx="${X(i)}" cy="${Y(p.v)}" r="4" fill="#2e6bff"/>`).join('')}
 <text x="${X(0)}" y="${Y(pts[0].v)-9}" text-anchor="middle" fill="#f2f3f6" font-size="11">${pts[0].v.toFixed(1)}</text>
 ${pts.length>1?`<text x="${X(pts.length-1)}" y="${Y(pts[pts.length-1].v)-9}" text-anchor="middle" fill="#f2f3f6" font-size="11">${pts[pts.length-1].v.toFixed(1)}</text>`:''}
 <text x="${P}" y="${H-6}" fill="#8b90a0" font-size="10">${dt(pts[0])}</text><text x="${W-P}" y="${H-6}" text-anchor="end" fill="#8b90a0" font-size="10">${pts.length>1?dt(pts[pts.length-1]):''}</text></svg>
 ${pts.length<2?'<small>Servono almeno due allenamenti per vedere la linea.</small>':''}`}

function openStats(w){
 w=w||S.hist[S.hist.length-1];
 if(!w)return openSheet('<h2>Statistiche</h2><small>Termina il primo allenamento per vedere mappa muscolare, volume e 1RM stimato.</small>');
 const on=new Set(),vol={};
 w.items.forEach(i=>{on.add(i.m);const g=GR[i.m];vol[g]=(vol[g]||0)+i.sets.reduce((t,x)=>t+x.kg*x.reps,0)});
 const names=[...new Set(S.hist.flatMap(x=>x.items.map(i=>i.n)))],first=w.items[0].n;
 openSheet(`<h2>${esc(w.day)} · ${new Date(w.date).toLocaleDateString('it',{day:'numeric',month:'long'})}</h2>
 <svg class="body" viewBox="0 0 200 200">${fig(0,true,on)}${fig(100,false,on)}</svg>
 <h4>Volume per distretto</h4>${donut(vol)}
 <h4>1RM stimato (Epley)</h4>
 <select id="sx">${names.map(n=>`<option ${n===first?'selected':''}>${esc(n)}</option>`).join('')}</select>
 <div id="ch" style="margin-top:8px">${chart(first)}</div>`)}

/* ---------- avvio ---------- */
(()=>{const c=document.createElement('canvas');c.width=c.height=180;const x=c.getContext('2d');
 x.fillStyle='#0d0e12';x.fillRect(0,0,180,180);x.fillStyle='#2e6bff';x.fillRect(28,84,124,12);
 x.fillRect(40,60,16,60);x.fillRect(60,48,16,84);x.fillRect(104,48,16,84);x.fillRect(124,60,16,60);
 $('#ic').href=c.toDataURL('image/png')})();
render();tick();lock();
</script>
</body>

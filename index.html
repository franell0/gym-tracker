<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Gym">
<meta name="theme-color" content="#ffffff">
<meta name="color-scheme" content="light">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<title>Gym</title>
<link rel="preload" href="fonts/archivo.woff2" as="font" type="font/woff2" crossorigin>
<style>
/* Archivo — SIL Open Font License 1.1, vedi fonts/OFL.txt */
@font-face{font-family:'Archivo';src:url(fonts/archivo.woff2) format('woff2');font-weight:400 800;font-style:normal;font-display:swap}
:root{--bg:#fff;--ink:#0a0a0a;--mute:#6e6e73;--faint:#a1a1a6;--line:#ececee;--soft:#f4f4f5;--fill:rgba(10,10,10,.06);color-scheme:light}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg)}
body{font-family:'Archivo',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;color:var(--ink);font-size:16px;line-height:1.35;-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%;overscroll-behavior-y:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;touch-action:manipulation;text-align:inherit}
input,textarea{font:inherit;color:inherit}
#app{max-width:560px;margin:0 auto;min-height:100vh;min-height:100dvh}
body.has-tabs #app{padding-bottom:calc(96px + env(safe-area-inset-bottom))}
body.in-session #app{padding-bottom:calc(250px + env(safe-area-inset-bottom))}
body.in-session.no-sel #app{padding-bottom:calc(110px + env(safe-area-inset-bottom))}
.wrap{padding:0 20px}
.num{font-variant-numeric:tabular-nums}

/* testate */
.top{padding:calc(env(safe-area-inset-top) + 36px) 20px 14px}
.top small{display:block;font-size:13px;font-weight:600;color:var(--mute);text-transform:capitalize;margin-bottom:2px}
h1{font-size:32px;font-weight:800;letter-spacing:-.025em;line-height:1.1}
h2{font-size:20px;font-weight:800;letter-spacing:-.015em;margin:30px 0 12px}
.sub{color:var(--mute);font-size:14px;margin-top:4px}
.back{display:inline-block;font-weight:600;font-size:15px;padding:calc(env(safe-area-inset-top) + 28px) 20px 0;color:var(--ink)}
.back+.top{padding-top:8px}

/* bottoni */
.btn{display:block;width:100%;background:var(--ink);color:#fff;border-radius:14px;padding:16px;font-weight:700;font-size:17px;text-align:center}
.btn.ghost{background:var(--soft);color:var(--ink)}
.btn.danger{background:none;color:#c0392b;font-size:15px;padding:12px}
.btn+.btn{margin-top:10px}
.btn.red{background:#c0392b;color:#fff}
.btn-s{background:var(--ink);color:#fff;border-radius:999px;padding:8px 16px;font-weight:700;font-size:14px}
.link{font-weight:600;font-size:15px;padding:10px 0}
.mute{color:var(--mute)}
.chev{color:var(--faint);font-size:22px;line-height:1}

/* tab bar */
.tabs{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);padding:6px 0 calc(6px + env(safe-area-inset-bottom));z-index:10}
.tabs-in{display:flex;max-width:560px;margin:0 auto}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:600;color:var(--faint);padding:5px 0;text-align:center}
.tab.on{color:var(--ink)}
.tab svg{width:24px;height:24px}

/* allena */
.live{display:flex;align-items:center;gap:14px;width:100%;background:var(--ink);color:#fff;border-radius:18px;padding:16px 18px;margin-bottom:14px}
.live div{flex:1}
.live small{display:block;font-size:12px;font-weight:700;color:#a1a1a6;text-transform:uppercase;letter-spacing:.06em}
.live b{font-size:18px}
.live .t{font-size:22px;font-weight:800;font-variant-numeric:tabular-nums}
.card{border:1px solid var(--line);border-radius:18px;margin-bottom:12px;overflow:hidden}
.plan-h{display:flex;align-items:center;width:100%;padding:16px 18px;gap:12px}
.plan-h div{flex:1}
.plan-h b{display:block;font-size:20px;font-weight:800;letter-spacing:-.01em}
.plan-h span{font-size:14px;color:var(--mute)}
.plan-h .chev{transition:transform .2s}
.plan-h.open .chev{transform:rotate(90deg)}
.plan-b{padding:0 18px 18px}
.dsq{width:38px;height:38px;border-radius:11px;background:color-mix(in srgb,var(--c) 32%,#fff);display:grid;place-items:center;font-weight:800;font-size:16px;flex:none}
.cdot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:7px;vertical-align:middle;position:relative;top:-1px}
.week{margin-bottom:18px}
.week-h{display:flex;align-items:center;justify-content:space-between;margin:0 -6px 8px}
.week-h span{font-size:14px;font-weight:700}
.week-h button{width:36px;height:32px;border-radius:10px;font-size:22px;line-height:1;text-align:center}
.week-h button:disabled{color:var(--line);cursor:default}
.week-d{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.wd{display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 0 7px;border-radius:999px;border:1.5px solid var(--line);text-align:center}
.wd:disabled{cursor:default;color:inherit}
.wd small{font-size:11px;font-weight:700;color:var(--mute)}
.wd b{font-size:16px;font-weight:700;font-variant-numeric:tabular-nums}
.wd i{width:6px;height:6px;border-radius:50%}
.wd.has{background:color-mix(in srgb,var(--c) 28%,#fff);border-color:var(--c)}
.wd.today{border-color:var(--ink);border-width:2px}
.pex{display:flex;justify-content:space-between;gap:12px;padding:11px 0;border-top:1px solid var(--line);font-size:15px}
.pex span:last-child{color:var(--mute);white-space:nowrap;font-variant-numeric:tabular-nums}
.plan-b .btn{margin-top:12px}

/* sessione */
.shead{position:sticky;top:0;z-index:5;background:#fff}
.bar{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:calc(env(safe-area-inset-top) + 20px) 16px 8px}
.bar .link{justify-self:start}
.bar .btn-s{justify-self:end}
.bar-c{text-align:center}
.bar-c small{display:block;font-size:12px;font-weight:700;color:var(--mute);text-transform:uppercase;letter-spacing:.06em}
.timer{font-size:22px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.prog{height:3px;background:var(--line)}
.prog i{display:block;height:100%;background:var(--ink);transition:width .3s}
.strip{display:flex;gap:8px;overflow-x:auto;padding:12px 20px;scrollbar-width:none;border-bottom:1px solid var(--line)}
.strip::-webkit-scrollbar{display:none}
.pill{flex:none;border:1px solid var(--line);border-radius:999px;padding:8px 14px;font-size:14px;font-weight:600;display:flex;gap:7px;align-items:center;white-space:nowrap}
.pill small{color:var(--mute);font-weight:700;font-size:12px;font-variant-numeric:tabular-nums}
.pill.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.pill.on small{color:#b5b5ba}
.pill.full:not(.on){color:var(--faint)}
.ex-h{padding:20px 0 6px}
.ex-h h1{font-size:28px}
.ex-meta{display:flex;align-items:center;flex-wrap:wrap;gap:6px;color:var(--mute);font-size:14px;margin-top:6px}
.chip-s{border:1px solid var(--line);border-radius:999px;padding:4px 10px;font-size:13px;font-weight:700;color:var(--ink)}
.note{margin-top:12px;font-size:14px;color:var(--mute);display:flex;gap:8px;align-items:flex-start}
.note svg{flex:none;width:16px;height:16px;margin-top:1px}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:16px}
.facts div{background:var(--soft);border-radius:14px;padding:12px}
.facts span{display:block;font-size:12px;font-weight:600;color:var(--mute)}
.facts b{display:block;font-size:15px;margin-top:2px;font-variant-numeric:tabular-nums}
.facts em{display:block;font-style:normal;font-size:12px;color:var(--mute);margin-top:2px}
.sets{margin:18px -12px 0}
.sets-h,.set{display:grid;grid-template-columns:30px 1fr 64px 44px 40px;align-items:center;gap:6px;padding:0 12px}
.sets-h{font-size:12px;font-weight:600;color:var(--mute);padding-bottom:6px}
.sets-h span:nth-child(3),.sets-h span:nth-child(4){text-align:center}
.set{padding-top:9px;padding-bottom:9px;border-radius:12px;font-variant-numeric:tabular-nums;width:100%}
.set .n{font-weight:800}
.set .prev{color:var(--mute);font-size:14px}
.set .v{text-align:center;font-size:17px;font-weight:700}
.set:not(.done):not(.sel) .v{color:var(--faint)}
.set.sel{background:var(--soft)}
.ck{width:34px;height:34px;border-radius:10px;border:1.5px solid #d6d6da;display:grid;place-items:center;justify-self:end;color:#d6d6da}
.ck svg{width:18px;height:18px}
.done .ck{background:var(--ink);border-color:var(--ink);color:#fff}
.set-note{grid-column:2/-1;font-size:13px;color:var(--mute);margin-top:-2px}
.row-btns{display:flex;justify-content:space-between;margin-top:4px}
.dock{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);z-index:10;padding:12px 0 calc(12px + env(safe-area-inset-bottom))}
.dock-in{max-width:560px;margin:0 auto;padding:0 16px}
.dock-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.dock-h b{font-size:15px}
.dock-h .link{padding:4px 0}
.steppers{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.stp label{display:block;font-size:12px;font-weight:600;color:var(--mute);margin-bottom:4px}
.stp-r{display:flex;align-items:center;background:var(--soft);border-radius:14px;padding:4px}
.stp-r button{width:44px;height:44px;border-radius:11px;background:#fff;font-size:24px;font-weight:500;display:grid;place-items:center;flex:none;box-shadow:0 1px 2px rgba(0,0,0,.06)}
.stp-r input{flex:1;min-width:0;width:100%;border:0;background:none;text-align:center;font-size:22px;font-weight:800;outline:none;font-variant-numeric:tabular-nums}

/* statistiche */
.stats{display:grid;grid-template-columns:repeat(var(--c,3),1fr);gap:8px}
.stat{background:var(--soft);border-radius:14px;padding:12px}
.stat span{display:block;font-size:12px;font-weight:600;color:var(--mute)}
.stat b{display:block;font-size:20px;font-weight:800;margin-top:2px;letter-spacing:-.01em;font-variant-numeric:tabular-nums;white-space:nowrap}
.pr{display:flex;gap:12px;align-items:center;border:1.5px solid var(--ink);border-radius:14px;padding:12px 14px;margin-bottom:8px}
.pr div{flex:1}
.pr b{display:block}
.pr span{font-size:13px;color:var(--mute)}
.badge{background:var(--ink);color:#fff;font-size:11px;font-weight:800;border-radius:6px;padding:3px 6px;letter-spacing:.03em;white-space:nowrap}
.warn{font-size:14px;color:var(--mute);margin:16px 0}
.actions{margin-top:24px}

/* liste */
.list{border-top:1px solid var(--line)}
.lrow{display:flex;width:100%;padding:14px 0;border-bottom:1px solid var(--line);align-items:center;gap:12px}
.lrow>div{flex:1;min-width:0}
.lrow b{display:block;font-size:16px;font-weight:600}
.lrow span{font-size:13px;color:var(--mute)}
.lrow .r{font-size:15px;font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums;white-space:nowrap}
.dt{width:42px;text-align:center;flex:none!important}
.dt small{display:block;font-size:11px;font-weight:700;color:var(--mute);text-transform:uppercase}
.dt b{font-size:22px!important;font-weight:800!important;line-height:1.1}
.wk{margin:26px 0 8px}
.wk b{display:block;font-size:17px;font-weight:800}
.wk span{font-size:13px;color:var(--mute)}
.grp{font-size:13px;font-weight:700;color:var(--mute);text-transform:uppercase;letter-spacing:.06em;margin:24px 0 4px}
.empty{color:var(--mute);font-size:15px;padding:24px 0}
.dex{margin-top:22px}
.dex h3{font-size:17px;font-weight:800}
.dex .m{font-size:13px;color:var(--mute)}
.drow{display:flex;gap:12px;padding:9px 0;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
.drow span:first-child{width:22px;font-weight:800}
.drow em{font-style:normal;color:var(--mute);font-size:13px;margin-left:auto;text-align:right}

/* progressi */
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -20px;padding:0 20px 2px}
.chips::-webkit-scrollbar{display:none}
.seg{display:flex;background:var(--soft);border-radius:12px;padding:3px;margin-top:12px}
.seg button{flex:1;padding:8px 4px;border-radius:10px;font-size:14px;font-weight:600;color:var(--mute);text-align:center}
.seg .on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.1)}
.big{margin-top:18px}
.big span{font-size:13px;color:var(--mute);font-weight:600}
.big b{display:block;font-size:34px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.chart{margin:10px 0 14px}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.ch-x{display:flex;justify-content:space-between;font-size:12px;color:var(--mute);margin-top:6px;font-variant-numeric:tabular-nums}
.chart-empty{background:var(--soft);border-radius:14px;padding:28px 16px;text-align:center;color:var(--mute);font-size:14px;margin:12px 0}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{border:1px solid var(--line);border-radius:12px;padding:10px 14px;font-weight:700;font-size:15px;font-variant-numeric:tabular-nums}
.opt.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.hint{font-size:13px;color:var(--mute);margin-top:8px}
.search{width:100%;background:var(--soft);border:0;border-radius:12px;padding:12px 14px;font-size:16px;outline:none}

/* fogli e avvisi */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.32);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:#fff;width:100%;max-width:560px;border-radius:22px 22px 0 0;padding:22px 20px calc(20px + env(safe-area-inset-bottom))}
.sheet h3{font-size:19px;font-weight:800;margin-bottom:14px}
.sheet textarea{width:100%;min-height:90px;border:1px solid var(--line);border-radius:12px;padding:12px;resize:none;font-size:16px;outline:none}
.sheet .opts{margin:12px 0 18px}
.sheet .opt{font-size:14px;font-weight:600}
#toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 12px);transform:translate(-50%,-160%);background:var(--ink);color:#fff;padding:12px 16px;border-radius:14px;font-size:14px;font-weight:600;transition:transform .25s;z-index:30;width:max-content;max-width:calc(100% - 32px);text-align:center}
#toast.show{transform:translate(-50%,0)}
#toast{display:flex;align-items:center;gap:14px;box-shadow:0 10px 30px rgba(0,0,0,.22);top:auto;bottom:calc(env(safe-area-inset-bottom) + 24px);transform:translate(-50%,calc(100% + 140px));transition:transform .45s cubic-bezier(.32,.72,0,1)}
#toast[hidden]{display:none!important}
#toast:not(.show){opacity:0;visibility:hidden;transition:transform .45s cubic-bezier(.32,.72,0,1),opacity .2s,visibility 0s .45s}body.has-tabs #toast{bottom:calc(env(safe-area-inset-bottom) + 84px)}
body.in-session #toast{bottom:calc(env(safe-area-inset-bottom) + 236px)}
body.in-session.no-sel #toast{bottom:calc(env(safe-area-inset-bottom) + 96px)}
#toast button{color:#fff;font-weight:800;font-size:14px;padding:4px 2px;text-decoration:underline;text-underline-offset:3px}

/* ---------- Rifinitura premium: ombre morbide, superfici bianche, feedback al tocco ---------- */
:root{--hair:rgba(10,10,20,.05);--sh:0 1px 2px rgba(16,16,24,.04),0 6px 18px rgba(16,16,24,.07);--sh-s:0 1px 2px rgba(16,16,24,.05),0 3px 8px rgba(16,16,24,.06)}
.card{border:1px solid var(--hair);border-radius:20px;box-shadow:var(--sh)}
.live{box-shadow:0 10px 28px rgba(10,10,10,.22)}
.stat{background:#fff;border:1px solid var(--hair);box-shadow:var(--sh-s);border-radius:16px}
.list{border-top:0;background:#fff;border:1px solid var(--hair);border-radius:18px;box-shadow:var(--sh);padding:0 16px}
.list>.lrow:last-child{border-bottom:0}
.list>.empty{padding:16px 0}
.dex{background:#fff;border:1px solid var(--hair);border-radius:18px;box-shadow:var(--sh);padding:16px 16px 6px;margin-top:14px}
.dex .drow:last-child{border-bottom:0}
.pr{border:1px solid var(--hair);border-left:4px solid var(--ink);box-shadow:var(--sh-s);background:#fff}
.wd{border-color:var(--hair);box-shadow:var(--sh-s);background:#fff}
.wd.has{border-color:var(--c)}
.wd.today{border-color:var(--ink)}
.pill,.opt,.chip-s{border-color:var(--hair);box-shadow:var(--sh-s);background:#fff}
.pill.on,.opt.on{background:var(--ink);border-color:var(--ink);box-shadow:0 4px 12px rgba(10,10,10,.22)}
.btn{box-shadow:0 8px 20px rgba(10,10,10,.20)}
.btn.ghost{background:#fff;border:1px solid var(--hair);box-shadow:var(--sh-s)}
.btn.danger{box-shadow:none}
.btn.red{box-shadow:0 8px 20px rgba(192,57,43,.25)}
.btn-s{box-shadow:0 4px 12px rgba(10,10,10,.22)}
.search{background:#fff;border:1px solid var(--hair);box-shadow:var(--sh-s)}
.tabs{border-top:0;box-shadow:0 -8px 28px rgba(16,16,24,.07)}
.dock{border-top:0;box-shadow:0 -10px 30px rgba(16,16,24,.09);border-radius:22px 22px 0 0}
.sheet{box-shadow:0 -12px 40px rgba(0,0,0,.18)}
.shead{box-shadow:0 8px 20px rgba(16,16,24,.05)}
.strip{border-bottom:0;padding-bottom:14px}
.prog{background:#f0f0f2}
.chart-empty{background:#fff;border:1px dashed #e2e2e6}
.btn,.live,.lrow,.wd:not(:disabled),.opt,.pill,.plan-h,.btn-s,.chip-s,.stp-r button,.ck{transition:transform .12s ease,box-shadow .12s ease}
.btn:active,.live:active,.wd:not(:disabled):active,.opt:active,.pill:active,.btn-s:active,.chip-s:active,.stp-r button:active,.ck:active{transform:scale(.96)}
.lrow:active,.plan-h:active{transform:scale(.985)}
/* calendario stile Apple: niente box, numero in cerchio solo per oggi e giorni allenati */
.week-d{gap:0}
.wd,.wd.has,.wd.today{background:none;border:0;box-shadow:none;border-radius:0;padding:2px 0;gap:6px}
.wd small{font-size:12px;font-weight:600;color:var(--faint);letter-spacing:.02em}
.wd b{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-size:18px;font-weight:600}
.wd.has b{background:color-mix(in srgb,var(--c) 30%,#fff);font-weight:700}
.wd.today small{color:var(--ink)}
.wd.today b{background:var(--ink);color:#fff;font-weight:700}
.wd.today.has b{box-shadow:0 0 0 3px #fff,0 0 0 5px var(--c)}
.wd i{width:5px;height:5px;margin-top:-2px}
.wd:not(:disabled):active{transform:scale(.92)}
.week-h{margin-bottom:12px}
/* barra del titolo piccolo */
#nav{position:fixed;top:0;left:0;right:0;z-index:9;background:#fff;padding-top:calc(env(safe-area-inset-top) + 12px);box-shadow:0 1px 0 var(--hair);opacity:0;pointer-events:none;transition:opacity .2s ease}
#nav.show{opacity:1;pointer-events:auto}
.nav-in{max-width:560px;margin:0 auto;height:46px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:0 16px}
.nav-in b{font-size:17px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:60vw}
.nav-in .link{justify-self:start;padding:8px 0}
/* fogli con molla */
.ov.enter{animation:ovIn .3s ease both}
.ov.enter .sheet{animation:sheetUp .5s cubic-bezier(.32,.72,0,1) both}
@keyframes ovIn{from{background-color:rgba(0,0,0,0)}}
@keyframes sheetUp{from{transform:translateY(100%)}}
.sheet{touch-action:none;padding-top:10px}
.sheet textarea{touch-action:auto}
.grab{width:38px;height:5px;border-radius:3px;background:#d8d8dc;margin:0 auto 16px}
/* swipe per eliminare */
.sw{position:relative;overflow:hidden;border-radius:12px}
.list>.sw{border-radius:0}
.list>.sw:first-child{border-radius:17px 17px 0 0}
.list>.sw:last-child{border-radius:0 0 17px 17px}
.list>.sw:only-child{border-radius:17px}
.list>.sw:last-child .lrow{border-bottom:0}
.list{padding:0}
.list>.lrow,.list>.empty{margin:0 16px;width:calc(100% - 32px)}
.list .sw-front.lrow{padding-left:16px;padding-right:16px}
.sw-act{position:absolute;top:0;right:0;bottom:0;width:88px;background:#ff3b30;color:#fff;font-weight:700;font-size:14px;text-align:center}
.sw:not(.on) .sw-act{visibility:hidden}
.sw-front{position:relative;z-index:1;background:#fff;touch-action:pan-y;transition:transform .4s cubic-bezier(.32,.72,0,1)}
.set.sw-front.sel{background:var(--soft)}
/* transizioni push/pop */
#app{position:relative;background:#fff}
.top{text-align:center}
.top small{text-transform:none}
.top small::first-letter{text-transform:uppercase}
.top .note{justify-content:center}
.sets{margin:18px 0 0;background:#fff;border:1px solid var(--hair);border-radius:20px;box-shadow:var(--sh);padding:14px 6px 6px}
.sets-h,.set{padding-left:10px;padding-right:10px}
.row-btns{margin-top:8px}
.chart{background:#fff;border:1px solid var(--hair);border-radius:18px;box-shadow:var(--sh);padding:16px 14px 12px}
/* streak */
.streak{display:flex;align-items:center;gap:12px;background:#fff;border:1px solid var(--hair);border-radius:20px;box-shadow:var(--sh);padding:12px 18px 12px 10px;margin-bottom:14px}
.st-f{width:60px;height:60px;display:grid;place-items:center;flex:none}
.flame{display:block;overflow:visible}
.st-t{flex:1;min-width:0}
.st-n{font-size:30px;font-weight:800;letter-spacing:-.03em;line-height:1}
.st-n small{font-size:15px;font-weight:700;letter-spacing:0}
.streak.zero .st-n{color:var(--faint)}
.st-t span{display:block;font-size:13px;color:var(--mute);margin-top:4px}
.st-t span b{font-weight:700}
.st-w{display:flex;flex-direction:column;gap:4px;flex:none}
.st-w i{display:block;width:22px;height:6px;border-radius:3px}
/* allena: settimana in fila */
.top-l{text-align:left}
.top-l .wk-nav{display:flex;align-items:center;justify-content:space-between;margin-top:2px}
.top-l .sub{margin:0}
.wk-nav button{width:36px;height:36px;border-radius:10px;font-size:22px;line-height:1;text-align:center}
.wk-nav button:disabled{color:var(--line);cursor:default}
.streak2{display:flex;align-items:center;gap:12px;padding:12px 16px;border-radius:18px;background:color-mix(in srgb,var(--t) 13%,#fff);margin-bottom:14px}
.streak2 div{flex:1;min-width:0}
.streak2 b{display:block;font-size:16px;font-weight:800}
.streak2 span{display:block;font-size:13px;color:var(--tt);margin-top:2px}
.streak2 em{font-style:normal;font-size:12px;font-weight:800;color:var(--tt);background:#fff;border-radius:999px;padding:4px 10px;flex:none}
.days{list-style:none;padding:0 4px}
.day{display:flex;align-items:stretch;gap:12px;min-height:60px}
.day-d{width:34px;flex:none;display:flex;flex-direction:column;justify-content:center;text-align:right;color:var(--faint)}
.day-d small{display:block;font-size:11px;font-weight:700}
.day-d b{display:block;font-size:17px;font-weight:800;line-height:1.15;font-variant-numeric:tabular-nums}
.day.has .day-d,.day.is-today .day-d{color:var(--ink)}
.day-l{width:16px;flex:none;display:flex;flex-direction:column;align-items:center}
.day-l i{width:2px;flex:1;background:var(--line)}
.day:first-child .day-l i:first-child,.day:last-child .day-l i:last-child{background:transparent}
.day-l span{width:14px;height:14px;flex:none;box-sizing:border-box;border-radius:50%;background:#d8d8dc;border:2px solid #d8d8dc}
.day.has .day-l span{background:var(--c);border-color:var(--c)}
.day.today .day-l span{background:#fff;border-color:var(--ink)}
.day.has.is-today .day-l span{box-shadow:0 0 0 2px #fff,0 0 0 4px var(--ink)}
.day.future .day-l span{background:#fff;border-color:#e5e5ea}
.day-c{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center;gap:5px;padding:5px 0}
.dw{display:flex;align-items:center;gap:10px;width:100%;min-height:50px;padding:7px 14px;border-radius:14px;background:color-mix(in srgb,var(--c) 45%,#fff);transition:transform .12s ease}
.dw:active{transform:scale(.985)}
.dw div{flex:1;min-width:0}
.dw b{display:block;font-size:15px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dw span{font-size:12px;color:#3d3d40}
.dw svg{width:20px;height:20px;flex:none}
.dr{font-size:14px;font-weight:600;color:var(--mute)}
.day.today .dr{color:var(--ink)}
.nextbar{position:fixed;z-index:9;left:50%;transform:translateX(-50%);width:calc(100% - 32px);max-width:528px;bottom:calc(env(safe-area-inset-bottom) + 112px);display:flex;align-items:center;gap:12px;padding:12px 12px 12px 18px;border-radius:22px;background:color-mix(in srgb,var(--c) 26%,#fff);box-shadow:0 8px 24px rgba(16,16,24,.10)}
.nb-i{flex:1;min-width:0;padding:4px 0}
.nb-i small{display:block;font-size:12px;font-weight:600;color:#55555a}
.nb-i b{display:block;font-size:19px;font-weight:800;letter-spacing:-.01em;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nb-t{display:block;font-size:13px;font-weight:600;color:#3d3d40;margin-top:3px}
.nb-ch{font-style:normal;font-size:14px;color:#55555a;position:relative;top:-3px}
.nb-go{display:flex;align-items:center;gap:7px;height:54px;padding:0 20px;border-radius:15px;background:var(--c);font-weight:800;font-size:16px;flex:none;transition:transform .12s ease}
.nb-go:active{transform:scale(.96)}
.nb-go svg{width:18px;height:18px}
body.has-next #app{padding-bottom:calc(232px + env(safe-area-inset-bottom))}
body.has-next #toast{bottom:calc(env(safe-area-inset-bottom) + 212px)}
.picks{display:flex;flex-direction:column;margin:-4px 0 14px}
.pick{display:flex;align-items:center;gap:12px;width:100%;padding:12px 0;border-bottom:1px solid var(--line)}
.pick:last-child{border-bottom:0}
.pick div{flex:1;min-width:0}
.pick b{display:block;font-size:16px;font-weight:700}
.pick div span{display:block;font-size:13px;color:var(--mute)}
.pick small{display:block;font-size:12px;color:var(--faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
/* festa a fine allenamento */
.cel{position:fixed;inset:0;z-index:30;background:#fff;display:flex;align-items:center;justify-content:center;text-align:center;padding:calc(env(safe-area-inset-top) + 24px) 28px calc(env(safe-area-inset-bottom) + 24px);animation:celIn .3s ease both}
.cel-in{width:100%;max-width:360px;display:flex;flex-direction:column;align-items:center}
.cel-fx{position:relative;width:100%;height:200px;display:flex;align-items:flex-end;justify-content:center}
.cel-g{transform-origin:50% 92%}
.cel.grow .cel-g{animation:flGrow .7s cubic-bezier(.34,1.56,.64,1) 1s both}
.cel .flame{transform-origin:50% 92%;animation:flPop .65s cubic-bezier(.34,1.56,.64,1) .1s both,flFlick 1.5s ease-in-out 1.8s 3}
.cel.lvl .fo{animation:flCol .5s ease 1.15s both}
.spark{position:absolute;left:50%;bottom:38px;width:8px;height:8px;margin-left:-4px;border-radius:50%;background:var(--sc);opacity:0;animation:spark 1.1s cubic-bezier(.2,.7,.3,1) var(--d) both}
.cel-n{font-size:64px;font-weight:800;letter-spacing:-.04em;line-height:1;margin-top:18px;animation:fadeUp .4s ease .35s both}
.roll{display:inline-block;height:1em;overflow:hidden;vertical-align:top}
.roll>i{display:block;font-style:normal;animation:rollUp .55s cubic-bezier(.34,1.56,.64,1) 1.05s both}
.roll span{display:block;height:1em;line-height:1}
.cel-u{font-size:15px;font-weight:700;color:var(--mute);margin-top:4px;animation:fadeUp .4s ease .4s both}
.cel-segs{display:flex;gap:6px;margin:18px 0 4px;animation:fadeUp .4s ease .45s both}
.cel-segs i{display:block;width:44px;height:8px;border-radius:4px;background:var(--line);overflow:hidden}
.cel-segs b{display:block;height:100%;border-radius:4px}
.cel-segs .new b{transform-origin:left;animation:segFill .5s cubic-bezier(.32,.72,0,1) .7s both}
.cel-h{margin:22px 0 6px;font-size:24px;animation:fadeUp .4s ease .55s both}
.cel-p{color:var(--mute);font-size:15px;animation:fadeUp .4s ease .6s both}
.cel-pr{display:flex;align-items:center;gap:8px;font-weight:700;font-size:15px;margin-top:14px;animation:fadeUp .4s ease .65s both}
.cel .btn{margin-top:30px;animation:fadeUp .4s ease .75s both}
@keyframes celIn{from{opacity:0}}
@keyframes flPop{from{transform:scale(.3);opacity:0}}
@keyframes flGrow{from{transform:scale(var(--g))}}
@keyframes flFlick{0%,100%{transform:scale(1)}30%{transform:scale(1.04,.97) skewX(-2deg)}60%{transform:scale(.98,1.04) skewX(2deg)}}
@keyframes flCol{from{fill:var(--c0)}to{fill:var(--c1)}}
@keyframes spark{0%{opacity:0;transform:translate(0,0) scale(.5)}15%{opacity:1}100%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(.2)}}
@keyframes rollUp{from{transform:translateY(0)}to{transform:translateY(-1em)}}
@keyframes segFill{from{transform:scaleX(0)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}}
@media (prefers-reduced-motion:reduce){.cel,.cel *{animation:none!important}.roll>i{transform:translateY(-1em)}.spark{display:none}}
</style>

<body>
<div id="nav"></div>
<div id="app"></div>
<div id="fixed"></div>
<div id="toast" hidden></div>
<input type="file" id="imp" accept="application/json,.json" hidden>
<script>
'use strict';
/* ---------- Scheda (modifica qui per cambiare esercizi) ---------- */
const KEY='gymapp.v1';
const MU={pet:'Petto',dor:'Dorso',spa:'Spalle',bic:'Bicipiti',tri:'Tricipiti',qua:'Quadricipiti',fem:'Femorali e glutei',pol:'Polpacci',cor:'Core'};
// nome, muscolo, range rep, kg di partenza, serie, nota macchina
const mk=(n,m,r,w,s,note)=>({n,m,r,w,s,note:note||''});
const PLAN=[
 // L'ordine qui sotto è la rotazione: dopo l'ultimo fatto viene proposto il successivo. color: colore dell'allenamento
 {id:'mar',name:'Squat-Bench-Lat',color:'#F5C400',ex:[
  mk('Squat','qua','6-8',35,3,'Fermo al parallelo'),
  mk('Panca piana','pet','6-8',25,3),
  mk('Lat pulldown','dor','6-8',53,3,'Cuscinetti al 3° foro'),
  mk('Leg curl seduto','fem','12-15',55,2,'Schienale 4, rullo 6'),
  mk('Shoulder press','spa','8-10',35,2,'Sedile 5'),
  mk('Reverse pec fly','spa','12-15',20,2),
  mk('Curl bicipiti','bic','8-10',12,2),
  mk('Tricipiti alla barra','tri','10-12',45,2),
  mk('Calf pendolum','pol','12-15',10,2),
  mk('Captains chair','cor','10-12',0,2)]},
 {id:'gio',name:'Bulgarian-Hyper-Row',color:'#E5484D',ex:[
  mk('Bulgarian split squat','qua','10-12',14,3),
  mk('Hyperextension','fem','10-12',0,3),
  mk('Low row','dor','8-10',55,3,'Petto sul cuscino'),
  mk('Panca inclinata manubri','pet','8-10',16,2,'Panca al 2° scatto'),
  mk('Alzate laterali','spa','12-15',6,2),
  mk('Hammer curl','bic','8-10',10,2),
  mk('Skull crushers','tri','10-12',10,2),
  mk('Calf press','pol','12-15',40,2),
  mk('Cable crunch','cor','10-12',69,2)]},
 {id:'sab',name:'Hack-Bar-Fly',color:'#8FD97A',ex:[
  mk('Hack squat','qua','10-12',75,3,'Schienale 3'),
  mk('T-bar','dor','8-10',25,3),
  mk('Pec fly','pet','12-15',15,2),
  mk('Lying leg curl','fem','10-12',44,2),
  mk('Alzate laterali ai cavi','spa','12-15',7,2),
  mk('Reverse pec fly','spa','12-15',15,2),
  mk('Bayesian curl','bic','10-12',15,2),
  mk('Tricipiti corde','tri','10-12',40,2),
  mk('Calf pendolum','pol','12-15',10,2),
  mk('Ab wheel rollout','cor','10-12',0,2)]}
];
const STEPS=[0.5,1,1.25,2,2.5,5];
// Streak: allenamenti a settimana per tenere la serie (di default tutti quelli della scheda)
const STREAK_TARGET=PLAN.length;
// Vecchi nomi dei giorni, per riconoscere gli allenamenti salvati prima del cambio
const LEGACY={'Martedì':'mar','Giovedì':'gio','Sabato':'sab'};

/* ---------- Utilità ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const e1=(kg,r)=>r<=1?kg:kg*(1+r/30);
const fk=v=>String(Math.round(v*100)/100).replace('.',',');
const fe=v=>fk(Math.round(v*10)/10);
const fV=v=>Math.round(v).toLocaleString('it-IT');
const fT=s=>{s=Math.max(0,Math.floor(s));const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return(h?h+':'+String(m).padStart(2,'0'):m)+':'+String(x).padStart(2,'0')};
const fD=(iso,o)=>new Date(iso).toLocaleDateString('it-IT',o||{weekday:'short',day:'numeric',month:'short'});
const fDur=m=>{m=Math.round(m);return m<60?m+' min':Math.floor(m/60)+' h '+String(m%60).padStart(2,'0')+' min'};
const topR=r=>parseInt(String(r).split('-').pop())||10;
const midnight=d=>{d=new Date(d);d.setHours(0,0,0,0);return d};
const rel=iso=>{const n=Math.round((midnight(Date.now())-midnight(iso))/864e5);return n<=0?'oggi':n===1?'ieri':n+' giorni fa'};
const monday=d=>{d=midnight(d);d.setDate(d.getDate()-((d.getDay()+6)%7));return d};
const vol=w=>w.items.reduce((t,i)=>t+i.sets.reduce((a,x)=>a+x.kg*x.reps,0),0);
const nsets=w=>w.items.reduce((t,i)=>t+i.sets.length,0);
const setTxt=x=>x.kg?fk(x.kg)+' × '+x.reps:x.reps+' rep';
const setsTxt=sets=>{if(!sets.length)return'—';const a=sets[0];if(sets.every(x=>x.kg===a.kg&&x.reps===a.reps))return sets.length+' × '+a.reps+(a.kg?' · '+fk(a.kg)+' kg':' · corpo libero');return sets.map(setTxt).join(' · ')};
const dayOf=id=>PLAN.find(p=>p.id===id);
const colOf=id=>(dayOf(id)||{}).color||'#c7c7cc';
const cdot=id=>`<i class="cdot" style="background:${colOf(id)}"></i>`;
const avg=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:0;

function bestOf(n,hist){let b=null;hist.forEach(w=>w.items.forEach(i=>{if(i.n!==n)return;i.sets.forEach(x=>{if(!x.kg)return;const v=e1(x.kg,x.reps);if(!b||v>b.e1+1e-6)b={e1:v,kg:x.kg,reps:x.reps,date:w.date}})}));return b}
function lastOf(n,hist){for(let k=hist.length-1;k>=0;k--){const i=hist[k].items.find(i=>i.n===n&&i.sets.length);if(i)return Object.assign({},i,{date:hist[k].date})}return null}
function lib(){const m={};PLAN.forEach(p=>p.ex.forEach(e=>{if(!m[e.n])m[e.n]=e}));
 S.hist.forEach(w=>w.items.forEach(i=>{if(!m[i.n])m[i.n]={n:i.n,m:i.m,r:'',w:i.sets.some(x=>x.kg>0)?1:0,s:0,note:''}}));return Object.values(m)}
function stepFor(n){if(S.steps[n]!=null)return S.steps[n];const e=lib().find(e=>e.n===n);return e&&e.w>0&&e.w<20?1:2.5}
function series(n,metric,hist){return hist.map(w=>{const i=w.items.find(i=>i.n===n);if(!i||!i.sets.length)return null;
 const v=metric==='e1'?Math.max(...i.sets.map(x=>e1(x.kg,x.reps))):metric==='top'?Math.max(...i.sets.map(x=>x.kg)):i.sets.reduce((a,x)=>a+x.kg*x.reps,0);return{d:w.date,v}}).filter(Boolean)}

/* ---------- Stato (salvato nel browser con la stessa chiave della versione precedente) ---------- */
function importLegacy(){try{const o=JSON.parse(localStorage.getItem('gym.v1'));if(o&&Array.isArray(o.hist))return o.hist.map((w,k)=>({id:'L'+k,date:w.date,dayId:(PLAN.find(p=>p.name===w.day||LEGACY[w.day]===p.id)||{}).id||'',day:w.day,dur:0,items:w.items}))}catch(e){}return[]}
const SCREENS=['allena','session','summary','storico','histDetail','progressi','esercizi','exercise'];
const S=(()=>{let s=null;try{s=JSON.parse(localStorage.getItem(KEY))}catch(e){}
 const o=Object.assign({screen:'allena',hist:null,session:null,openPlan:'mar',histSel:null,exSel:null,exFrom:'esercizi',progEx:'Squat',metric:'e1',steps:{}},s||{});
 if(!Array.isArray(o.hist))o.hist=s?[]:importLegacy();
 if(!o.steps||typeof o.steps!=='object')o.steps={};
 o.hist.forEach(w=>{const d=dayOf(w.dayId);if(d)w.day=d.name});
 const ss=o.session;
 if(ss){const d=dayOf(ss.dayId);if(!d||!Array.isArray(ss.sets)||ss.sets.length!==d.ex.length)o.session=null;
  else ss.sets.forEach(a=>a.forEach(x=>{delete x.pr}))}
 if(!SCREENS.includes(o.screen)||(!o.session&&['session','summary'].includes(o.screen)))o.screen='allena';
 if(!['e1','top','vol'].includes(o.metric))o.metric='e1';
 o.q='';return o})();
const UI={sheet:null,wk:0};
function save(){try{const {q,...p}=S;localStorage.setItem(KEY,JSON.stringify(p))}catch(e){}}
let toastT,toastH;function toast(msg,action){const t=$('#toast');t.innerHTML=`<span>${esc(msg)}</span>${action?`<button data-a="${action.a}">${esc(action.label)}</button>`:''}`;
 clearTimeout(toastH);t.hidden=false;void t.offsetWidth;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(hideToast,action?5000:2600)}
function hideToast(){const t=$('#toast');t.classList.remove('show');UI.undo=null;clearTimeout(toastH);toastH=setTimeout(()=>{if(!t.classList.contains('show')){t.hidden=true;t.innerHTML=''}},500)}

/* ---------- Icone ---------- */
const svg=(d,w)=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${w||2}" stroke-linecap="round" stroke-linejoin="round"><path d="${d}"/></svg>`;
const ICON={allena:'M6 4v16M18 4v16M3 8v8M21 8v8M6 12h12',storico:'M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8M3 3v5h5M12 7v5l4 2',progressi:'M22 7l-8.5 8.5-5-5L2 17M16 7h6v6',esercizi:'M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01'};
const CHECK=svg('M20 6 9 17l-5-5',3);
const INFO=svg('M12 16v-4M12 8h.01M22 12a10 10 0 1 1-20 0 10 10 0 0 1 20 0');

/* ---------- Grafico ---------- */
function chart(vals,fmt){
 if(vals.length<2)return `<div class="chart-empty">${vals.length?'Serve almeno un’altra sessione per il grafico':'Nessun dato ancora'}</div>`;
 const W=320,H=130,PX=5,PY=12,vs=vals.map(p=>p.v);let mn=Math.min(...vs),mx=Math.max(...vs);const lo=mn,hi=mx;if(mx-mn<1){mx+=1;mn-=1}
 const X=i=>PX+i*(W-2*PX)/(vals.length-1),Y=v=>PY+(1-(v-mn)/(mx-mn))*(H-2*PY);
 const P=vals.map((p,i)=>X(i).toFixed(1)+','+Y(p.v).toFixed(1));
 const area='M'+X(0).toFixed(1)+','+H+' L'+P.join(' L')+' L'+X(vals.length-1).toFixed(1)+','+H+' Z';
 const dots=vals.map((p,i)=>{const last=i===vals.length-1;return `<circle cx="${X(i).toFixed(1)}" cy="${Y(p.v).toFixed(1)}" r="${last?4.5:2.5}" fill="${last?'#0a0a0a':'#fff'}" stroke="#0a0a0a" stroke-width="1.5"/>`}).join('');
 return `<div class="chart"><svg viewBox="0 0 ${W} ${H}"><line x1="0" x2="${W}" y1="${H}" y2="${H}" stroke="#ececee"/><path d="${area}" fill="rgba(10,10,10,.05)"/><polyline points="${P.join(' ')}" fill="none" stroke="#0a0a0a" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>${dots}</svg>
 <div class="ch-x"><span>${fD(vals[0].d,{day:'numeric',month:'short'})}</span><span>min ${fmt(lo)} · max ${fmt(hi)}</span><span>${fD(vals[vals.length-1].d,{day:'numeric',month:'short'})}</span></div></div>`}

/* ---------- Schermate ---------- */
const tabOf=()=>({allena:'allena',storico:'storico',histDetail:'storico',progressi:'progressi',esercizi:'esercizi',exercise:S.exFrom==='progressi'?'progressi':'esercizi'})[S.screen];

function vTabs(){const t=tabOf();return `<nav class="tabs"><div class="tabs-in">${[['allena','Allena'],['storico','Storico'],['progressi','Progressi'],['esercizi','Esercizi']].map(([id,l])=>`<button class="tab ${t===id?'on':''}" data-a="go" data-to="${id}">${svg(ICON[id])}${l}</button>`).join('')}</div></nav>`}

/* ---------- Streak (settimane di fila con la scheda completata) ---------- */
function streakInfo(){const cnt={};S.hist.forEach(w=>{const k=monday(w.date).getTime();cnt[k]=(cnt[k]||0)+1});
 const now=monday(Date.now()),nowK=now.getTime(),thisWeek=S.hist.filter(w=>monday(w.date).getTime()===nowK);
 let cur=0,best=0,run=0;

const nextTxt=c=>{const nx=tierOf(c).nx;return nx?nx[1]+' tra '+(nx[0]-c)+' '+pl(nx[0]-c,'settimana','settimane'):'Livello massimo raggiunto'};
const FLAME_O='M12 2c.6 3.2-1.1 5.1-2.9 7C7.4 10.8 6 12.7 6 15.2 6 18.9 8.7 22 12 22s6-3.1 6-6.8c0-2.4-1.1-4.4-2.4-5.9-.3 1.6-1.1 2.8-2.3 3.4.6-3.6-.2-7.5-1.3-10.7z';

function vStreak(){const st=streakInfo(),c=st.cur,{t}=tierOf(c),left=Math.max(0,STREAK_TARGET-st.done),full=left===0;
 const title=c?c+' '+pl(c,'settimana di fila','settimane di fila'):'Nessuna serie ancora';
 const msg=full?'Settimana completata · '+nextTxt(c):(c?'Ancora '+left+' questa settimana per tenere la serie':'Fai '+STREAK_TARGET+' allenamenti in una settimana per accendere la fiamma');

function vCel(){const k=UI.cel;if(!k)return'';const b=k.b,a=k.a,wk=a.cur>b.cur,T0=tierOf(b.cur).t,T1=tierOf(a.cur).t,lvl=wk&&T0[0]!==T1[0];
 const left=Math.max(0,STREAK_TARGET-a.done),extra=a.done>STREAK_TARGET;
 const title=lvl?'Nuovo livello: '+T1[1]:wk?'Settimana completata':extra?'Allenamento extra':'Allenamento salvato';
 const sub=wk?nextTxt(a.cur):extra?'La serie di questa settimana è già al sicuro':'Ancora '+left+' questa settimana per '+(a.cur?'tenere la serie':'accendere la fiamma');
 const s1=celSize(a.cur),s0=wk?celSize(b.cur):s1;
 const segs=Array.from({length:STREAK_TARGET},(_,i)=>{const w=a.week[i];return `<i class="${i===Math.min(a.done,STREAK_TARGET)-1&&!extra?'new':''}">${w?`<b style="background:${colOf(w.dayId)}"></b>`:''}</i>`}).join('');
 const nsp=wk?16:7,sp=Array.from({length:nsp},(_,i)=>{const ang=(i/nsp-.5)*2.2+(i%2?.15:-.15),r=wk?120+(i*37)%70:80+(i*23)%40;

const SW=88;let sw=null;
function hideAct(f){setTimeout(()=>{if(!f.classList.contains('open')&&!f.style.transform)f.parentElement.classList.remove('on')},420)}
function closeRows(except){document.querySelectorAll('.sw-front.open').forEach(f=>{if(f!==except){f.classList.remove('open');f.style.transform='';hideAct(f)}})}
document.addEventListener('pointerdown',e=>{const f=e.target.closest('.sw-front');if(!f){if(!e.target.closest('.sw-act'))closeRows();return}
 sw={f,x0:e.clientX,y0:e.clientY,base:f.classList.contains('open')?-SW:0,dir:null,x:0,id:e.pointerId}});
document.addEventListener('pointermove',e=>{if(!sw||e.pointerId!==sw.id)return;const dx=e.clientX-sw.x0,dy=e.clientY-sw.y0;
 if(!sw.dir){if(Math.abs(dx)>8&&Math.abs(dx)>Math.abs(dy)){sw.dir='h';closeRows(sw.f);sw.f.style.transition='none';sw.f.parentElement.classList.add('on');try{sw.f.setPointerCapture(e.pointerId)}catch(_){}}else if(Math.abs(dy)>8){sw=null;return}else return}
 let x=sw.base+dx;if(x>0)x=x/4;if(x<-SW)x=-SW+(x+SW)/3;sw.x=x;sw.f.style.transform=`translateX(${x}px)`});
function endSwipe(e){if(!sw||e.pointerId!==sw.id)return;const s=sw;sw=null;
 if(!s.dir){if(s.base){UI.noClick=true;setTimeout(()=>UI.noClick=false,50);s.f.classList.remove('open');s.f.style.transition='';s.f.style.transform='';hideAct(s.f)}return}
 UI.noClick=true;setTimeout(()=>UI.noClick=false,50);const open=s.x<-SW/2;s.f.style.transition='';s.f.classList.toggle('open',open);s.f.style.transform=open?`translateX(${-SW}px)`:'';if(!open)hideAct(s.f)}

function startSession(id,force){const s=S.session;
 if(s&&s.dayId===id){S.screen='session';return render()}
 if(s&&!force)return ask('Sostituire la sessione?','C’è già una sessione in corso ('+dayOf(s.dayId).name+'). Le serie fatte andranno perse.','Sostituisci',()=>startSession(id,true));
 const day=dayOf(id);
 const sets=day.ex.map(e=>{const l=lastOf(e.n,S.hist);return Array.from({length:e.s},(_,j)=>{const ls=l&&(l.sets[j]||l.sets[l.sets.length-1]);return{kg:ls?ls.kg:e.w,reps:topR(e.r),done:false,note:''}})});
 S.session={dayId:id,start:Date.now(),cur:0,sel:0,sets};S.screen='session';render()}
function firstOpen(ss){let k=ss.sets.findIndex((s,i)=>i>ss.cur&&s.some(y=>!y.done));if(k<0)k=ss.sets.findIndex(s=>s.some(y=>!y.done));return k}
function doneSet(){const ss=S.session,a=ss.sets[ss.cur],j=ss.sel;if(j==null||!a[j]||a[j].done)return;
 a[j].done=true;let next=a.findIndex(y=>!y.done);
 if(next<0){const k=firstOpen(ss);if(k>=0){ss.cur=k;next=ss.sets[k].findIndex(y=>!y.done)}}
 ss.sel=next<0?null:next;
 if(ss.sets.every(s=>s.every(y=>y.done)))toast('Tutte le serie completate 💪');
 render()}
function setVal(f,v){const ss=S.session,a=ss.sets[ss.cur],j=ss.sel;if(j==null||!a[j])return;
 for(let k=j;k<a.length;k++)if(!a[k].done||k===j){a[k][f]=v;const c=document.querySelector(`[data-c="${f}-${k}"]`);if(c)c.textContent=f==='kg'?fk(v):v}save()}
function saveWorkout(){const ss=S.session,day=dayOf(ss.dayId);
 const items=day.ex.map((e,i)=>({n:e.n,m:e.m,sets:ss.sets[i].filter(x=>x.done).map(x=>({kg:x.kg,reps:x.reps,note:x.note||''}))})).filter(i=>i.sets.length);
 if(!items.length){toast('Completa almeno una serie per salvare');return}
 const w={id:'h'+Date.now(),date:new Date(ss.start).toISOString(),dayId:day.id,day:day.name,dur:durMin(ss),items,prs:prsOf(ss).length};
 const before=streakInfo();
 S.hist.push(w);S.hist.sort((a,b)=>new Date(a.date)-new Date(b.date));S.session=null;S.screen='histDetail';S.histSel=w.id;
 const after=streakInfo();UI.cel={b:before,a:after,prs:w.prs};render();

function markBackup(){S.lastBackup=new Date().toISOString();render()}
async function exportData(){const data={app:'gym-tracker',v:1,exported:new Date().toISOString(),hist:S.hist,steps:S.steps};
 const name='gym-backup-'+new Date().toISOString().slice(0,10)+'.json',txt=JSON.stringify(data);
 const blob=new Blob([txt],{type:'application/json'});
 try{const file=new File([blob],name,{type:'application/json'});
  if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:'Backup Gym'});markBackup();toast('Backup esportato');return}}
 catch(e){if(e&&e.name==='AbortError')return}
 const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();
 setTimeout(()=>URL.revokeObjectURL(url),2000);markBackup();toast('Backup esportato')}
const num=(v,d)=>{v=+v;return isFinite(v)&&v>=0?v:d};
function cleanHist(arr){if(!Array.isArray(arr))return null;const out=[];
 arr.forEach((w,k)=>{if(!w||!Array.isArray(w.items))return;const t=new Date(w.date);if(isNaN(t))return;
  const items=w.items.filter(i=>i&&typeof i.n==='string'&&Array.isArray(i.sets)).map(i=>({n:i.n.slice(0,80),m:MU[i.m]?i.m:'',
   sets:i.sets.filter(x=>x&&typeof x==='object').map(x=>({kg:Math.round(num(x.kg,0)*100)/100,reps:Math.round(num(x.reps,0)),note:typeof x.note==='string'?x.note.slice(0,200):''}))})).filter(i=>i.sets.length);
  if(!items.length)return;const d=dayOf(w.dayId)||PLAN.find(p=>p.name===w.day||LEGACY[w.day]===p.id);
  out.push({id:typeof w.id==='string'&&w.id?w.id.slice(0,40):'i'+t.getTime()+'_'+k,date:t.toISOString(),dayId:d?d.id:'',day:d?d.name:String(w.day||'Allenamento').slice(0,60),dur:Math.round(num(w.dur,0)),items,prs:Math.round(num(w.prs,0))})});
 return out}
function readImport(file){const r=new FileReader();
 r.onload=()=>{let o;try{o=JSON.parse(r.result)}catch(e){return toast('File non valido: non è un backup JSON')}
  const hist=cleanHist(o&&o.hist);if(!hist)return toast('File non valido: manca lo storico');
  const ids=new Set(S.hist.map(w=>w.id)),keys=new Set(S.hist.map(w=>w.date+'|'+w.dayId));
  const fresh=hist.filter(w=>!ids.has(w.id)&&!keys.has(w.date+'|'+w.dayId));
  const steps={};if(o.steps&&typeof o.steps==='object')Object.keys(o.steps).forEach(n=>{const v=+o.steps[n];if(STEPS.includes(v))steps[n]=v});
  if(!fresh.length&&!Object.keys(steps).length)return toast('Niente di nuovo: lo storico è già aggiornato');
  ask('Importare il backup?','Il file contiene '+hist.length+(hist.length===1?' allenamento':' allenamenti')+': '+(fresh.length===1?'1 nuovo verrà aggiunto':fresh.length+' nuovi verranno aggiunti')+' allo storico. Quelli già presenti restano come sono.','Importa',()=>{
   S.hist=S.hist.concat(fresh).sort((a,b)=>new Date(a.date)-new Date(b.date));Object.assign(S.steps,steps);S.screen='storico';render();
   toast(fresh.length===1?'1 allenamento importato':fresh.length+' allenamenti importati')})};
 r.onerror=()=>toast('Impossibile leggere il file');r.readAsText(file)}
document.addEventListener('change',e=>{if(e.target.id!=='imp')return;const f=e.target.files&&e.target.files[0];e.target.value='';if(f)readImport(f)});

 delSetAt:d=>{const ss=S.session,a=ss.sets[ss.cur],j=+d.i;if(a.length<2){toast('Serve almeno una serie');closeRows();return}
  UI.undo={start:ss.start,cur:ss.cur,j,set:a[j],sel:ss.sel};
  a.splice(j,1);toast('Serie '+(j+1)+' eliminata',{a:'undo',label:'Annulla'});if(ss.sel===j){const f=a.findIndex(y=>!y.done);ss.sel=f<0?null:f}else if(ss.sel!=null&&ss.sel>j)ss.sel--;render()},
 noop:()=>{},
 noteChip:d=>{const ss=S.session;if(ss.sel!=null){ss.sets[ss.cur][ss.sel].note=d.t;const ta=document.querySelector('[data-in="note"]');if(ta)ta.value=d.t;save()}},
 setStep:d=>{const n=S.screen==='session'&&S.session?dayOf(S.session.dayId).ex[S.session.cur].n:S.exSel;if(n){S.steps[n]=+d.v;render()}},
 openHist:d=>{S.histSel=d.id;S.screen='histDetail';render()},
 delHist:d=>ask('Eliminare l’allenamento?','Verrà tolto dallo storico. Non si può annullare.','Elimina',()=>{S.hist=S.hist.filter(w=>w.id!==d.id);S.screen='storico';render()}),
 prog:d=>{S.progEx=d.n;render()},
 metric:d=>{S.metric=d.m;render()},
 openEx:d=>{S.exSel=d.n;S.exFrom=d.from;S.screen='exercise';render()},
};
document.addEventListener('click',e=>{if(UI.noClick){UI.noClick=false;e.preventDefault();return}const el=e.target.closest('[data-a]');if(!el)return;const f=A[el.dataset.a];if(f)f(el.dataset,e)});
document.addEventListener('input',e=>{const t=e.target,k=t.dataset.in;if(!k)return;
 if(k==='q'){S.q=t.value;$('#lib').innerHTML=libList();return}
 if(k==='note'){const ss=S.session;if(ss&&ss.sel!=null){ss.sets[ss.cur][ss.sel].note=t.value;save()}return}
 const v=parseFloat(t.value.replace(',','.'));if(isNaN(v)||v<0)return;setVal(k,k==='reps'?Math.round(v):Math.round(v*100)/100)});
document.addEventListener('focusin',e=>{const t=e.target;if(t.dataset&&(t.dataset.in==='kg'||t.dataset.in==='reps'))setTimeout(()=>t.select(),0)});
document.addEventListener('focusout',e=>{const t=e.target,k=t.dataset&&t.dataset.in;if((k==='kg'||k==='reps')&&S.session){const x=S.session.sets[S.session.cur][S.session.sel];if(x)t.value=k==='kg'?fk(x.kg):x.reps}});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.dataset&&['kg','reps'].includes(e.target.dataset.in))e.target.blur()});
render();
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js',{updateViaCache:'none'}).catch(()=>{}));
</script>
</body>
</html>
